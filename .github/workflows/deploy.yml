name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

# Declare dummy environment variables globally so python-decouple doesn't crash
env:
  SECRET_KEY: 'dummy-secret-key-for-github-actions'
  DEBUG: 'True'
  ALLOWED_HOSTS: 'localhost,127.0.0.1'

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Tests
        run: python MusicPlayer/manage.py test

      - name: Collect Static Files
        run: python MusicPlayer/manage.py collectstatic --noinput